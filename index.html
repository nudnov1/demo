<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазинный Калькулятор</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #eef6ff;
            border-radius: 15px;
            text-align: center;
        }

        .result-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .savings {
            font-size: 14px;
            color: #28a745;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Скидки в магазине</h2>

    <div class="input-group">
        <label for="price">Цена (₪):</label>
        <input type="number" id="price" placeholder="Например: 100" oninput="calculate()">
    </div>

    <div class="input-group">
        <label for="discount">Скидка (%):</label>
        <input type="number" id="discount" placeholder="Например: 65" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="result-label">Итого к оплате:</div>
        <div id="total" class="result-value">0 ₪</div>
        <div id="saved" class="savings">Вы экономите: 0 ₪</div>
    </div>
</div>

<script>
    function calculate() {
        const price = parseFloat(document.getElementById('price').value);
        const discount = parseFloat(document.getElementById('discount').value);
        
        const totalElement = document.getElementById('total');
        const savedElement = document.getElementById('saved');

        if (!isNaN(price) && !isNaN(discount)) {
            // Формула: Сумма - (Сумма * (Процент / 100))
            const discountAmount = price * (discount / 100);
            const finalPrice = price - discountAmount;

            totalElement.innerText = finalPrice.toLocaleString() + ' ₪';
            savedElement.innerText = 'Вы экономите: ' + discountAmount.toLocaleString() + ' ₪';
        } else {
            totalElement.innerText = '0 ₪';
            savedElement.innerText = 'Вы экономите: 0 ₪';
        }
    }
</script>

</body>
</html>
