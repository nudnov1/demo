<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шоппинг Калькулятор Израиль</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --secondary-color: #5856D6;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #333;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .result-box {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .res-val {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .tax-res { color: var(--secondary-color); }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Калькулятор скидок -->
    <div class="card">
        <h2>🏷️ Скидка (Минус %)</h2>
        <div class="input-group">
            <label>Цена товара (₪)</label>
            <input type="number" id="p1" placeholder="100" oninput="calcDiscount()">
        </div>
        <div class="input-group">
            <label>Скидка (%)</label>
            <input type="number" id="d1" placeholder="65" oninput="calcDiscount()">
        </div>
        <div class="result-box">
            <div style="font-size: 0.8rem; color: #888;">Цена со скидкой:</div>
            <div id="r1" class="res-val">0 ₪</div>
        </div>
    </div>

    <!-- Калькулятор налога -->
    <div class="card">
        <h2>💰 Налог (МААМ / НДС)</h2>
        <div class="input-group">
            <label>Сумма (₪)</label>
            <input type="number" id="p2" placeholder="100" oninput="calcTax()">
        </div>
        <div class="input-group">
            <label>Ставка налога (%)</label>
            <input type="number" id="t2" value="18" oninput="calcTax()">
        </div>
        <div class="result-box" style="background: #f5f3ff;">
            <div style="font-size: 0.8rem; color: #888;">Сумма налога:</div>
            <div id="r2" class="res-val tax-res">0 ₪</div>
            <div id="r2_total" style="font-size: 0.9rem; color: #444; margin-top: 5px;">Итого с налогом: 0 ₪</div>
        </div>
    </div>

</div>

<script>
    function calcDiscount() {
        const p = parseFloat(document.getElementById('p1').value);
        const d = parseFloat(document.getElementById('d1').value);
        const res = document.getElementById('r1');
        
        if (p && d) {
            res.innerText = (p - (p * d / 100)).toFixed(2) + ' ₪';
        } else {
            res.innerText = '0 ₪';
        }
    }

    function calcTax() {
        const p = parseFloat(document.getElementById('p2').value);
        const t = parseFloat(document.getElementById('t2').value);
        const res = document.getElementById('r2');
        const resTotal = document.getElementById('r2_total');
        
        if (p && t) {
            const taxAmount = p * (t / 100);
            res.innerText = taxAmount.toFixed(2) + ' ₪';
            resTotal.innerText = 'Итого с налогом: ' + (p + taxAmount).toFixed(2) + ' ₪';
        } else {
            res.innerText = '0 ₪';
            resTotal.innerText = 'Итого с налогом: 0 ₪';
        }
    }
</script>

</body>
</html>
